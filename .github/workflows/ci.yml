name: ci
# Runs on every pull request and is ALSO a reusable workflow (workflow_call): deploy.yml calls it on pushes to main and
# only builds/deploys images when it is green. (No separate `push: main` trigger on purpose: it would run CI twice per merge.)
on:
  pull_request:
  workflow_call:

# github.workflow is the CALLER's name for reusable workflows, so a deploy run never cancels (or is cancelled by) a PR run.
concurrency: { group: "ci-${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }

permissions: { contents: read }

defaults:
  run: { working-directory: backend }

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: backend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: backend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:modules          # module graph: acyclic, manifests == package.json, no deep imports
      - run: pnpm test                   # unit, api, contract, connector, database (PGlite: real migrations + RLS)
      - name: OpenAPI contract is committed and up to date
        run: |
          pnpm openapi:export
          git diff --exit-code docs/api/openapi.json
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: oms_owner, POSTGRES_PASSWORD: oms_owner, POSTGRES_DB: oms_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U oms_owner" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://oms_owner:oms_owner@localhost:5432/oms_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: backend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: backend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  docker:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix: { app: [api, worker, scheduler, webhook-worker] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/infrastructure/docker/Dockerfile
          build-args: APP=${{ matrix.app }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    env: { HUSKY: "0" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: "Typecheck (app + node tsconfig references)"
        run: npx tsc -b
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
        env: { VITE_USE_MOCKS: "false", VITE_API_BASE_URL: /api/v1 }
      # Advisory for now: known findings that need a breaking major upgrade are tracked in the README; flip to blocking when clean.
      - name: Dependency audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  frontend-docker:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
