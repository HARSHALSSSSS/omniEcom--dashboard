# Rendered by the nginx image entrypoint (envsubst on ${API_UPSTREAM} only; nginx's own $variables are untouched).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/ttf;

  # liveness/readiness for the container and Kubernetes (static, never proxied)
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Same-origin API: the browser calls /api/v1/*. Only /api/ is forwarded - never /metrics, /docs or /health.
  # In Kubernetes the Ingress usually routes /api straight to the API Service; this block keeps the image self-sufficient.
  location ^~ /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    client_max_body_size 10m;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # Vite emits content-hashed files under /assets: cache for a year
  location ^~ /assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # never cache the entry document: a deploy must be picked up on the next navigation
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # SPA fallback; other static files (icons, logos) get a short cache
  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location ~* \.(?:svg|png|jpe?g|webp|ico|woff2?)$ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
  }
}
