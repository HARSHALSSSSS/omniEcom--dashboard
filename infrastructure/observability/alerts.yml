groups:
  - name: oms-slo
    rules:
      - alert: ApiHighErrorRate
        expr: sum(rate(http_request_duration_seconds_count{service="api",status_code=~"5.."}[5m])) / sum(rate(http_request_duration_seconds_count{service="api"}[5m])) > 0.02
        for: 5m
        labels: { severity: page }
        annotations: { summary: "API 5xx rate above 2% for 5m" }
      - alert: ApiHighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service="api"}[5m]))) > 1
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "API p95 latency above 1s for 10m" }
      - alert: JobFailureRateHigh
        expr: sum by (queue) (rate(jobs_processed_total{status="failed"}[10m])) / sum by (queue) (rate(jobs_processed_total[10m])) > 0.1
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "More than 10% of jobs failing on queue {{ $labels.queue }}" }
      - alert: MarketplaceCallsFailing
        expr: sum by (marketplace) (rate(marketplace_calls_total{outcome!="ok"}[10m])) / sum by (marketplace) (rate(marketplace_calls_total[10m])) > 0.25
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: "Marketplace {{ $labels.marketplace }} calls failing >25% (outage or credential expiry)" }
